name: Canary Tests

on:
  push:
    branches:
      - canary
  pull_request:
    branches:
      - canary

jobs:
  test:
    name: Run all tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit

  create-pr-to-dev:
    name: Create PR to dev (requires admin approval)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - name: Create PR to dev branch
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          base: dev
          branch: canary
          title: "Merge canary into dev"
          body: |
            Este PR fusiona los últimos cambios de la rama `canary` en `dev`.

            ⚠️ Requiere revisión y aprobación de un administrador.
          labels: "auto-pr"
          draft: false