services:
  server:
    build:
      context: .
    ports:
      - 8080:8080
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    restart: always
    user: mysql
    environment:
      - MYSQL_DATABASE=f5pi
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - db-data:/var/lib/mysql
    expose:
      - 3306
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data: